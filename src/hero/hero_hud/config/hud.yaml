# HUD 렌더러 설정.
#
# display 항목은 전부 민경태의 광학 하드웨어가 확정되기 전의 임시값이다.
# 특히 hfov_deg 는 2.5D 뷰가 "장면"이 될지 "계기"가 될지를 가르는 숫자다.
# docs/HUD_전략.md 10절.

hero_hud:
  ros__parameters:
    display:
      width_px: 1280
      height_px: 800

      # --- 물리 사양 ---
      # 화각은 여기서 유도된다. 10인치 16:10 패널을 광로 1.0 m 로 보면 12.3도이고,
      # 시력 0.1 사용자에게 그 화면은 분해 셀 74 x 46 짜리다.
      #   광로 0.7 m → 17.5도    광로 1.2 m → 10.3도
      # 평면 컴바이너면 광로 = (눈→컴바이너) + (컴바이너→패널).
      diagonal_inch: 10.0
      aspect_w: 16.0
      aspect_h: 10.0
      view_distance_m: 1.00

      # 0 이하이면 위에서 계산한다. 양수면 그것이 이긴다 (시험용).
      hfov_deg: 0.0

      # --- 매핑 ---
      # legibility | pinhole
      #
      # 핀홀은 물리적으로 옳지만 좁은 화각에서 화면을 통째로 비운다 — 12도에서
      # 보이는 지면 띠가 2.5~3.6 m뿐이라 궤적도 장애물도 뷰포트 밖으로 나간다.
      # 장면 정합이 없으므로 투영이 물리적으로 옳을 의무가 없고, 가독성 매핑은
      # 담는 범위가 고정이라 화각과 무관하게 내용이 화면을 채운다.
      mapping: legibility

      # 화면 좌우 끝이 담는 횡방향 거리, 위쪽 끝이 담는 종방향 거리.
      lateral_half_m: 1.8
      range_m: 6.0
      # 원근감. 0이면 순수 평면도.
      taper: 0.35
      # 종방향 압축. 작을수록 가까운 곳이 화면을 더 많이 가져간다.
      compress: 0.55
      # 압축의 근거리 바닥값. 0이면 d=0에서 기울기가 발산해 바닥 모서리가 톱니가 된다.
      near_floor_m: 0.30
      top_margin: 0.12
      bottom_margin: 0.0

      # --- 핀홀 매핑 전용 ---
      eye_height_m: 1.20
      eye_forward_m: 1.20
      pitch_down_deg: 22.0

      # 좌우 반전. **기본이 켜짐이다** — 표시는 텔레프롬프터에 투사되고, 반사를
      # 거치면 화면이 뒤집혀 보이므로 미리 뒤집어야 똑바로 읽힌다.
      #
      # 화면 전체에 걸린다: 지면 요소는 투영(projection.cpp applyOptics),
      # 글자와 좌우 고정 자리는 그려진 텍스처(chrome_item.cpp). 둘 중 하나만
      # 걸면 반사 후 글자가 거울상이 되거나 좌우 고정 자리가 뒤바뀐다.
      #
      # 반사면 없이 모니터로 직접 볼 때만 끈다 — tools/shoot.sh 와 record.sh 가
      # 그래서 이 값을 false 로 덮어쓴다(문서 캡처는 눈으로 읽어야 한다).
      mirror_horizontal: true

      # 키스톤 보정. 좌상, 우상, 우하, 좌하 순서의 정규화 좌표 8개.
      # 기본은 항등. 현장에서 네 귀퉁이를 끌어 맞춘 값을 여기 적는다.
      keystone: [0.0, 0.0, 1.0, 0.0, 1.0, 1.0, 0.0, 1.0]

      near_m: 0.5

    vehicle:
      # IONIQ Electric 실차값. 상위 문서 17-8.
      wheelbase_m: 2.700
      width_m: 1.820
      length_m: 4.470
      # base_link 가 후륜축 접지점이 아니면 여기서 보정한다.
      base_to_rear_axle_m: 0.0

    # vision-road의 도색 조각·경계·점선 종류. 모두 base_link 좌표.
    # 경계와 선 종류는 vision_road lane_display_filter 가 표시용으로 평활한 토픽을 쓴다
    # (원본: /road/lane_boundary_markers, /road/lane_styles).
    road:
      paint_topic: /road/lane_markers
      boundary_topic: /road/lane_display_markers
      style_topic: /road/lane_display_styles
      # 점선 경계를 그리기 시작하는 x (base_link, 후륜축). lane_display_filter 가 기억한 칠로
      # 차까지 이어 주므로 0 (궤적 시작점, 화면 아래). 코드 기본값은 3.0.
      dash_near_m: 0.0

    timeout:
      # 이 시간을 넘도록 안 오면 저하 단계를 내린다. docs/HUD_전략.md 6절.
      vehicle_sec: 0.5
      scene_sec: 1.0

    path:
      # 현재궤적을 얼마나 앞까지 그릴지. 실제로 그려지는 길이는 가장자리 두 줄이
      # 분해 한계 안으로 수렴하는 지점에서 잘린다.
      length_m: 8.0
      samples: 160

    # 시각 예산. 모든 표시 크기가 여기서 유도된다 — 화면 높이의 분수를 쓰지 않는다.
    # docs/HUD_전략.md 4절, 13-4.
    acuity:
      # 조아영님 양안 교정시력. 모형은 균일 굴절성 흐림이다.
      acuity: 0.10

      # 형태를 나르는 획은 분해 한계의 2배. 획 자체가 분해되어야 모양이 남는다.
      stroke_detail_multiple: 2.0

      # 장애물 표식은 분해 한계의 12배 (시력 0.1 에서 2도).
      symbol_detail_multiple: 12.0

      # 글자는 스넬렌 문턱(= 분해 한계의 5배)의 3배. 문턱은 "겨우 판별"이지
      # "읽힌다"가 아니다.
      text_threshold_multiple: 3.0

      # 이보다 가까운 두 표식은 흐림 속에서 하나로 뭉친다. 미리 합친다.
      separation_detail_multiple: 2.0

      # 읽히는 글자가 화면 높이의 이 비율을 넘으면 글자를 포기한다.
      # 그때는 음성과 도형이 정보를 나른다.
      text_max_height_frac: 0.22

      # 동시에 그릴 장애물 표식의 최대 개수. 12.3도 화면은 74 x 46 셀이고
      # 구분 가능한 표식을 5~10개 놓을 수 있다. 궤적과 상태 표시가 이미 일부를 쓴다.
      max_marks: 3
