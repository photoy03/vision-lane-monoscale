# global_mapping_cpp defaults: topic input, values validated in the live/replay pipeline.
# vision_mapping_bringup loads this file first and applies only vehicle overrides from
# vision_mapping_bringup/config/lane_detection.yaml. Camera hardware (device, capture
# size, optical frame) is vehicle-specific: see that file or global_mapping_v4l2.yaml.
# calibration_yaml is empty here; launches pass vision_mapping_bringup/config/calibration.
global_mapping_cpp:
  ros__parameters:
    compressed_image_input: false
    input_mode: topic
    publish_raw_image: false
    raw_image_topic: /parking/cpp/image_raw
    odom_topic: /parking/odom
    output_topic: /parking/cpp/marking_segments
    map_image_topic: /parking/cpp/global_marking_map
    status_topic: /parking/cpp/status
    calibration_yaml: ''
    camera_id: front
    map_frame: map
    base_frame: base_link
    use_static_pose: false
    odom_buffer_duration_sec: 14.0
    max_odom_age_sec: 0.15
    max_odom_interpolation_gap_sec: 0.25
    require_odom_for_mapping: true
    allow_local_without_odom: true
    publish_debug_map: true
    map_publish_every_n: 5
    profile_csv_path: /tmp/v52_cpp_v4l2_profile.csv
    profile_report_every: 120
    preprocess_backend: cpu
    cuda_device_id: 0
    cuda_fallback_to_cpu: false
    camera_height_m: 0.8
    camera_forward_m: 0.0
    camera_left_m: 0.0
    pitch_deg: 30.0
    roll_deg: 0.0
    yaw_deg: 0.0
    x_min_m: -4.0
    x_max_m: 4.0
    y_min_m: 0.0
    y_max_m: 5.0
    meters_per_pixel: 0.0125
    white_s_max: 60
    white_v_min: 140
    yellow_h_min: 15
    yellow_h_max: 40
    yellow_s_min: 70
    yellow_v_min: 70
    glare_v_min: 248
    glare_s_max: 95
    glare_min_area_ratio: 0.006
    glare_dilate: 9
    illumination_sigma_m: 0.6
    illumination_scale: 0.35
    normalization_scale: 128.0
    tophat_size_m: 0.3
    threshold_bands: 6
    threshold_update_interval: 3
    threshold_sample_stride: 4
    mad_k: 5.5
    threshold_margin: 3.0
    threshold_min: 8.0
    threshold_max: 80.0
    strong_response_margin: 36.0
    glare_recovery_margin: 20.0
    hough_threshold: 28
    hough_min_line_length_m: 0.65
    hough_max_line_gap_m: 0.18
    hough_max_raw_segments: 120
    candidate_min_length_m: 0.7
    candidate_min_binary_support: 0.72
    candidate_min_color_support: 0.08
    candidate_min_score: 0.46
    candidate_max_glare_ratio: 0.85
    line_min_width_m: 0.05
    line_max_width_m: 0.22
    line_target_width_m: 0.12
    dominant_angle_tolerance_deg: 12.0
    dominant_min_confidence: 0.35
    merge_distance_m: 0.2
    merge_gap_m: 0.35
    final_min_span_m: 0.85
    final_min_score: 0.52
    max_vectors_each: 8
    vectorize_every_n: 1
    temporal_history_size: 5
    temporal_confirm_hits: 3
    temporal_angle_gate_deg: 7.0
    temporal_offset_gate_m: 0.32
    temporal_gap_gate_m: 0.6
    temporal_max_missed_updates: 3
    temporal_ema_alpha: 0.15
    map_x_min_m: -10.0
    map_x_max_m: 20.0
    map_y_min_m: -15.0
    map_y_max_m: 15.0
    map_resolution_m: 0.05
    map_evidence_increment: 1.0
    map_evidence_max: 20.0
    map_confirm_evidence: 3.0
    map_min_translation_m: 0.05
    map_min_yaw_deg: 1.0
    sync_images_to_odom: true
    sync_queue_size: 40
    sync_max_wait_sec: 1.2
    pending_observations_enabled: true
    pending_observation_ttl_sec: 12.0
    pending_observation_max_count: 128
    pending_observation_unresolvable_grace_sec: 2.0
    pending_commit_budget: 2
    global_tracker_reset_gap_sec: 1.0
    allow_short_odom_prediction: true
    odom_prediction_wait_sec: 1.05
    max_odom_prediction_sec: 0.4
    startup_warmup_frames: 120
    image_quality_gate_mode: reject
    image_quality_min_sharpness: 25.0
    image_quality_sample_width: 640
    publish_debug_vectors: true
    temporal_anchor_offset_m: 0.4
    pending_readiness_enabled: false
    pending_blocked_head_grace_sec: 4.0
    # Retire a head whose odometry bracket is complete but unusable instead of
    # blocking the ordered queue until the TTL (2026-10-17 5-run compare:
    # lane map input delay p50 12.2 s -> 1.4 s, map content unchanged).
    pending_drop_unresolvable_head: true
