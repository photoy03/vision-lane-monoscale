# Package defaults for the time-matched map set (docs/STRUCTURE_KO.md "통합 지도").
map_assembler:
  ros__parameters:
    history_sec: 10.0          # snapshots kept per layer to find a common exact time T
    stall_timeout_sec: 5.0     # no complete_through progress this long (ROS clock) = stalled layer
    allow_incomplete: false    # strict: freeze T when a layer stalls; true: publish with stale_layers
    pose_max_gap_sec: 0.25     # pose at T only from a measured pose or a bracket no wider than this
    tick_hz: 5.0
map_visualizer:
  ros__parameters:
    pixel_m: 0.05              # image resolution; the occupancy layer is 0.1 m, lanes 0.05 m
