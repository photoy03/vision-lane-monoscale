# Whole-pipeline launch options.
launch_arguments:
  use_sim_time: 'false'
  launch_viewer: 'true'
  launch_rviz: 'false'
  launch_occupancy: 'false'
  stage_diagnostics: 'false'
  recovery_session_id: ''
  output_dir: ''
  # Time-matched map set + its image (map_assembly). Empty = off.
  launch_fusion: ''
  # Test hook: provenance topic map_assembler reads (empty = <pose topic>/provenance).
  fusion_provenance_topic: ''
  # Test hook: observation topic lane_map reads in map mode (empty = /parking/cpp/lane_observations).
  lane_map_observation_topic: ''
