# Vehicle overrides only. Node defaults live in the owning package:
#   monoscale_pose/config/odom_stabilizer.yaml (lane_odom_stabilizer)
# launch_arguments: command-line knobs. An empty value means "use the package default".
launch_arguments:
  # Pose the maps use: monoscale (camera odometry, default) or lidar (KISS-ICP /lidar/odometry
  # through scripts/lidar_pose_bridge.py; the stabilizer then reads /localization/lidar_raw with
  # its vision yaw correction and IMU fill off). lidar_yaw_offset_deg: vehicle minus LiDAR heading.
  pose_source: monoscale
  lidar_yaw_offset_deg: '31.1'
  # LiDAR position in base_link (lever arm), pose_source:=lidar only. base_link here is the front
  # bumper (front camera 0.08 m ahead of it); LiDAR 0.9 m ahead of the rear axle, rear axle 3.6135 m
  # behind the bumper (vehicle 4.5135 m, rear overhang 0.90) -> -2.71 (owner 2026-11-14).
  # On 20261113_172234 it moved camera-occupied cells on LiDAR obstacles from 19 % to 48 %.
  lidar_x_m: '-2.71'
  lidar_y_m: ''
  yaw_correction_enabled: ''
  vision_yaw_sign: ''
  imu_yaw_rate_tau_sec: '0.12'
  yaw_bias_tau_sec: ''
  yaw_bias_limit_deg_s: ''
  yaw_straight_rate_deg_s: ''
  yaw_straight_hold_sec: ''
  yaw_turn_blend: ''
  straight_resample_span_sec: ''
  yaw_max_visual_correction_deg: ''
  resample_odom_to_camera: ''
  # IMU-rate pose fill between raw visual odometry updates (lane_odom_stabilizer imu_fill_enabled).
  pose_imu_fill: ''
